<h2 mat-dialog-title>Editando: {{ editorConfig?.document?.title }}</h2>

<mat-dialog-content>
    <!-- Error definitivo (onLoadComponentError) -->
    <div *ngIf="errorCarga" class="flex flex-col items-center justify-center p-8 text-center space-y-4" data-testid="error-editor">
        <mat-icon class="text-rose-500 scale-150">error_outline</mat-icon>
        <p class="text-rose-600 font-bold text-sm" data-testid="mensaje-error-editor">
            {{ mensajeError || 'No se pudo abrir el editor' }}
        </p>
        <button *ngIf="data?.onDescargar" mat-flat-button color="primary" (click)="descargar()" class="gap-1" data-testid="btn-descargar-editor-fallo">
            <mat-icon class="scale-90">download</mat-icon>
            <span>Descargar</span>
        </button>
    </div>

    <!-- Aviso no destructivo si tarda más de 20s (el editor sigue montado) -->
    <div *ngIf="!errorCarga && tardando" class="mb-3 p-3 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-800 dark:text-amber-200 text-xs flex items-center justify-between gap-3" data-testid="aviso-tardando-editor">
        <div class="flex items-center gap-2">
            <mat-icon class="text-amber-600 dark:text-amber-400 text-base">schedule</mat-icon>
            <span>El editor está tardando en cargar... Si no abre, puede descargar el archivo.</span>
        </div>
        <button *ngIf="data?.onDescargar" mat-stroked-button color="warn" (click)="descargar()" class="text-xs shrink-0" data-testid="btn-descargar-editor-tardando">
            <mat-icon class="scale-75">download</mat-icon>
            <span>Descargar</span>
        </button>
    </div>

    <!-- Editor ONLYOFFICE -->
    <document-editor 
        *ngIf="!errorCarga"
        id="docxEditor" 
        [documentServerUrl]="documentServerUrl" 
        [config]="editorConfig"
        [events_onDocumentReady]="onDocumentReady" 
        [onLoadComponentError]="onLoadComponentError"
        [events_onDocumentStateChange]="onDocumentStateChange">
    </document-editor>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cerrar Editor</button>
</mat-dialog-actions>
