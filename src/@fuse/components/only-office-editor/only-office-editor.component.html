<h2 mat-dialog-title>Editando: {{ editorConfig?.document?.title }}</h2>

<mat-dialog-content>
    <div *ngIf="errorCarga" class="flex flex-col items-center justify-center p-8 text-center space-y-4" data-testid="error-editor">
        <mat-icon class="text-rose-500 scale-150">error_outline</mat-icon>
        <p class="text-rose-600 font-bold text-sm" data-testid="mensaje-error-editor">
            {{ mensajeError || 'No se pudo abrir el editor' }}
        </p>
        <button *ngIf="data?.onDescargar" mat-flat-button color="primary" (click)="descargar()" class="gap-1" data-testid="btn-descargar-editor-fallo">
            <mat-icon class="scale-90">download</mat-icon>
            <span>Descargar</span>
        </button>
    </div>

    <document-editor 
        *ngIf="!errorCarga"
        id="docxEditor" 
        [documentServerUrl]="documentServerUrl" 
        [config]="editorConfig"
        [events_onDocumentReady]="onDocumentReady" 
        [onLoadComponentError]="onLoadComponentError"
        [events_onDocumentStateChange]="onDocumentStateChange">
    </document-editor>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cerrar Editor</button>
</mat-dialog-actions>
