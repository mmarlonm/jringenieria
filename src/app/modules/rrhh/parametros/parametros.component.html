<div class="flex flex-col flex-auto min-w-0">
    <div class="flex flex-col shadow bg-card">
        <div class="flex flex-col p-6 sm:p-10 border-b">
            <div class="text-3xl font-bold tracking-tight">Parámetros de RRHH</div>
            <div class="text-secondary">
                Valores de la LFT, umbrales y ventanas de alerta que usan las reglas del módulo. Cada cambio queda en la bitácora.
            </div>
        </div>
    </div>

    <div class="p-6 sm:p-10">
        @if (cargando) {
            <div class="text-secondary">Cargando…</div>
        } @else {
            <div class="bg-card shadow rounded-2xl divide-y">
                @for (fila of filas; track fila.parametro.clave) {
                    <div class="grid grid-cols-1 items-center gap-x-4 p-4 sm:grid-cols-12">
                        <div class="sm:col-span-6">
                            <div class="font-semibold">{{ fila.parametro.clave }}</div>
                            <div class="text-secondary text-sm">{{ fila.parametro.descripcion }}</div>
                        </div>
                        <mat-form-field class="sm:col-span-4" subscriptSizing="dynamic">
                            <mat-label>Valor</mat-label>
                            <input matInput [formControl]="fila.control" maxlength="200" (keydown.enter)="guardar(fila)">
                        </mat-form-field>
                        <div class="sm:col-span-2 sm:text-right mt-2 sm:mt-0">
                            <button mat-flat-button color="primary" type="button"
                                [disabled]="fila.guardando || fila.control.pristine || !fila.control.value.trim()"
                                (click)="guardar(fila)">
                                Guardar
                            </button>
                        </div>
                    </div>
                }
            </div>
        }
    </div>
</div>
