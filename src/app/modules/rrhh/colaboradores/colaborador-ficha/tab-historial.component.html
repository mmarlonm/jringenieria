<div class="pt-6">
    @if (error) {
        <div class="rounded-2xl bg-red-50 p-4 text-red-800">{{ error }}</div>
    } @else {
        <div class="overflow-auto rounded-2xl border">
            <table mat-table [dataSource]="items" class="w-full">
                <ng-container matColumnDef="fecha">
                    <th mat-header-cell *matHeaderCellDef>Fecha</th>
                    <td mat-cell *matCellDef="let h">{{ h.fecha | date: 'dd/MM/yyyy HH:mm' }}</td>
                </ng-container>
                <ng-container matColumnDef="usuario">
                    <th mat-header-cell *matHeaderCellDef>Usuario</th>
                    <td mat-cell *matCellDef="let h">{{ h.usuario || '—' }}</td>
                </ng-container>
                <ng-container matColumnDef="campo">
                    <th mat-header-cell *matHeaderCellDef>Campo</th>
                    <td mat-cell *matCellDef="let h" class="font-medium">{{ h.campo }}</td>
                </ng-container>
                <ng-container matColumnDef="anterior">
                    <th mat-header-cell *matHeaderCellDef>Anterior</th>
                    <td mat-cell *matCellDef="let h">{{ h.anterior ?? '—' }}</td>
                </ng-container>
                <ng-container matColumnDef="nuevo">
                    <th mat-header-cell *matHeaderCellDef>Nuevo</th>
                    <td mat-cell *matCellDef="let h">{{ h.nuevo ?? '—' }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnas"></tr>
                <tr mat-row *matRowDef="let row; columns: columnas"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell p-6 text-secondary" [attr.colspan]="columnas.length">
                        {{ cargando ? 'Cargando…' : 'Sin cambios registrados.' }}
                    </td>
                </tr>
            </table>
        </div>
    }
</div>
