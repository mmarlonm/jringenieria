<div class="fixed inset-0 overflow-y-auto overflow-x-hidden bg-gradient-to-br from-slate-50 via-[#e6eff5] to-slate-200 select-none dark:from-slate-900 dark:via-slate-950 dark:to-slate-900">
    
    <div class="flex flex-col items-center justify-start sm:justify-center min-h-full p-0 sm:p-4 md:p-6">
        
        <div class="w-full min-h-screen sm:min-h-0 sm:max-w-md bg-white dark:bg-slate-950 border-0 sm:border border-slate-100 dark:border-slate-900/50 rounded-none sm:rounded-3xl overflow-hidden shadow-none sm:shadow-2xl text-slate-800 dark:text-slate-100 transition-all duration-300 relative flex flex-col">
            
            <!-- Encabezado con Ondas -->
            <div class="relative w-full overflow-visible bg-[#005082] h-32 flex-shrink-0 flex items-center justify-center">
                
                <h2 class="text-2xl font-black text-white relative z-20 -mt-4 text-center">
                    Registro de Staff
                </h2>

                <!-- Double Curve Wave Overlay -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200" class="absolute bottom-0 left-0 w-full fill-current block select-none pointer-events-none z-10" style="margin-bottom: -1px;">
                    <!-- Green Wave (Back) -->
                    <path fill="#008232" d="M0,80 C320,180 960,20 1440,110 L1440,200 L0,200 Z"></path>
                    <!-- Blue Wave (Middle) -->
                    <path fill="#005082" d="M0,110 C320,200 960,50 1440,130 L1440,200 L0,200 Z"></path>
                    <!-- White Card Body Cut (Front) -->
                    <path fill="currentColor" class="text-white dark:text-slate-950" d="M0,130 C320,210 960,80 1440,150 L1440,200 L0,200 Z"></path>
                </svg>
            </div>

            <!-- Cuerpo de la Tarjeta -->
            <div class="p-6 relative flex-grow flex flex-col justify-between">
                
                <div *ngIf="isSuccess" class="text-center py-8">
                    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 dark:bg-[#008232]/20 mb-4">
                        <svg class="h-8 w-8 text-[#008232]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">¡Registro Exitoso!</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Tu información ha sido guardada correctamente.</p>
                </div>

                <form *ngIf="!isSuccess" class="space-y-5" (ngSubmit)="submitForm()">
                    
                    <p class="text-xs text-center text-slate-500 dark:text-slate-400 mb-4">
                        Completa tu información para el evento
                    </p>

                    <!-- Nombre Completo -->
                    <div>
                        <label for="nombre" class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">
                            Nombre Completo <span class="text-red-500">*</span>
                        </label>
                        <input id="nombre" name="nombre" type="text" required [(ngModel)]="nombreCompleto"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#005082] focus:border-transparent sm:text-sm dark:bg-slate-900 dark:text-white transition-all">
                    </div>

                    <!-- WhatsApp -->
                    <div>
                        <label for="whatsapp" class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">
                            Número de WhatsApp
                        </label>
                        <input id="whatsapp" name="whatsapp" type="tel" [(ngModel)]="telefonoWhatsapp"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#005082] focus:border-transparent sm:text-sm dark:bg-slate-900 dark:text-white transition-all"
                            placeholder="Ej. 5512345678">
                    </div>

                    <!-- Foto -->
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">
                            Fotografía <span class="text-red-500">*</span>
                        </label>
                        
                        <div *ngIf="!fotoPreview" class="mt-1 flex justify-center px-6 py-8 border-2 border-slate-200 dark:border-slate-800 border-dashed rounded-xl relative cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors">
                            <div class="space-y-1 text-center">
                                <svg class="mx-auto h-10 w-10 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <div class="flex text-sm text-slate-600 dark:text-slate-400 justify-center">
                                    <label for="file-upload" class="relative cursor-pointer bg-transparent rounded-md font-medium text-[#005082] hover:text-[#008232] transition-colors focus-within:outline-none">
                                        <span>Subir una foto</span>
                                        <input id="file-upload" name="file-upload" type="file" class="sr-only" accept="image/*" (change)="onFileSelected($event)">
                                    </label>
                                </div>
                                <p class="text-[10px] text-slate-500 dark:text-slate-500">PNG o JPG</p>
                            </div>
                        </div>
                        
                        <div *ngIf="fotoPreview" class="relative mt-2 flex flex-col items-center">
                            <img [src]="fotoPreview" class="h-32 w-32 object-cover rounded-full shadow-lg border-4 border-white dark:border-slate-800">
                            <button type="button" (click)="removeFoto()" class="mt-3 inline-flex items-center px-4 py-1.5 border border-transparent text-[10px] font-bold tracking-wider uppercase rounded-full shadow-sm text-white bg-red-500 hover:bg-red-600 focus:outline-none transition-colors">
                                Cambiar Foto
                            </button>
                        </div>
                    </div>

                    <!-- Alergias -->
                    <div class="pt-2">
                        <label class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3">
                            ¿Eres alérgico(a) a algún alimento?
                        </label>
                        <div class="flex items-center space-x-6">
                            <div class="flex items-center">
                                <input id="alergia-no" name="alergia" type="radio" value="no" [(ngModel)]="esAlergico" class="h-4 w-4 text-[#005082] focus:ring-[#005082] border-slate-300 dark:bg-slate-900 dark:border-slate-700">
                                <label for="alergia-no" class="ml-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
                                    No
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input id="alergia-si" name="alergia" type="radio" value="si" [(ngModel)]="esAlergico" class="h-4 w-4 text-[#005082] focus:ring-[#005082] border-slate-300 dark:bg-slate-900 dark:border-slate-700">
                                <label for="alergia-si" class="ml-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
                                    Sí
                                </label>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="esAlergico === 'si'" class="animate-fade-in-up">
                        <label for="alergia-cual" class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">
                            ¿A cuál? <span class="text-red-500">*</span>
                        </label>
                        <input id="alergia-cual" name="alergia-cual" type="text" [(ngModel)]="alergiaCual"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#005082] focus:border-transparent sm:text-sm dark:bg-slate-900 dark:text-white transition-all"
                            placeholder="Ej. Mariscos, Cacahuates...">
                    </div>

                    <div class="pt-6">
                        <button type="submit" [disabled]="isSubmitting"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-[#005082] hover:bg-[#003d63] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#005082] disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                            <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            {{ isSubmitting ? 'Guardando...' : 'Completar Registro' }}
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
