<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />
  <rect width="1200" height="500" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="350" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Central Emblem Box -->
  <g transform="translate(600, 210)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="65" fill="#020617" stroke="url(#accentGrad)" stroke-width="3" opacity="0.9" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Camera / Film Icon -->
    <path d="M-22,-14 L-14,-14 L-10,-20 L10,-20 L14,-14 L22,-14 C26,-14 28,-12 28,-8 L28,16 C28,20 26,22 22,22 L-22,22 C-26,22 -28,20 -28,16 L-28,-8 C-28,-12 -26,-14 -22,-14 Z M0,-6 C-9,-6 -16,1 -16,10 C-16,19 -9,26 0,26 C9,26 16,19 16,10 C16,1 -9,-6 0,-6 Z M0,-1 C6,-1 11,4 11,10 C11,16 6,21 0,21 C-6,21 -11,16 -11,10 C-11,4 -6,-1 0,-1 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    SIN FOTO PUBLICITARIA
  </text>

  <text x="600" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="2">
    FORO ENERGIZA 2026 — ACTIVIDAD OFICIAL
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="520" y="405" width="160" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
